name: Refresh dashboard cache

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dashboard refresh
        run: |
          curl -sf -X POST "${{ secrets.PROD_URL }}/api/cron/refresh-dashboard" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
